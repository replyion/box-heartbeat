name: freeze-watch
# Runs on GitHub-hosted runners (free), independent of the box.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live
          fetch-depth: 1

      - name: Evaluate heartbeat age
        id: eval
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let raw;
            try { raw = fs.readFileSync('heartbeat/latest.json', 'utf8'); }
            catch (e) {
              core.setOutput('stale', 'true');
              core.setOutput('age_min', '9999');
              core.setOutput('ts', 'missing');
              return;
            }
            const data = JSON.parse(raw);
            const ts = Date.parse(data.ts);
            const ageMin = Math.floor((Date.now() - ts) / 60000);
            const stale = !Number.isFinite(ts) || ageMin > 60;
            core.setOutput('stale', stale ? 'true' : 'false');
            core.setOutput('age_min', String(ageMin));
            core.setOutput('ts', data.ts || 'invalid');
            console.log(JSON.stringify({ ts: data.ts, ageMin, stale }));

      - name: Open or keep single freeze issue
        if: steps.eval.outputs.stale == 'true'
        env:
          HB_AGE: ${{ steps.eval.outputs.age_min }}
          HB_TS: ${{ steps.eval.outputs.ts }}
        uses: actions/github-script@v7
        with:
          script: |
            const age = process.env.HB_AGE;
            const ts = process.env.HB_TS;
            const label = 'box-freeze';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: label,
                color: 'b60205', description: 'Box heartbeat stale >60min'
              });
            }
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 5
            });
            if (open.data.length > 0) {
              console.log('Already open #' + open.data[0].number + '; dedupe — no new issue/email');
              return;
            }
            const body = [
              '## Box freeze / heartbeat stale',
              '',
              'Last heartbeat: `' + ts + '` (age **' + age + '** minutes; threshold 60).',
              '',
              'The Replyion box has not pushed `heartbeat/latest.json` for over an hour.',
              'Likely a platform freeze. CI runners and Claude Code will stall until it thaws.',
              '',
              '**Email target:** juangabrielarca10@gmail.com',
              'Watch this repo (Issues) or accept the collaborator invite so GitHub emails you on new `box-freeze` issues.',
              '',
              'This issue auto-closes when the heartbeat recovers.',
              '',
              '_freeze-watch · no secrets · no paid services · no COCO usage_'
            ].join('\n');
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'BOX FREEZE: heartbeat ' + age + 'm old (threshold 60m)',
              body,
              labels: [label],
              assignees: ['juangabrielarca10-arch']
            }).catch(async (e) => {
              console.log('create with assignee failed: ' + e.message);
              return github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'BOX FREEZE: heartbeat ' + age + 'm old (threshold 60m)',
                body,
                labels: [label]
              });
            });
            console.log('Opened #' + created.data.number);

      - name: Close freeze issue on recovery
        if: steps.eval.outputs.stale == 'false'
        env:
          HB_AGE: ${{ steps.eval.outputs.age_min }}
          HB_TS: ${{ steps.eval.outputs.ts }}
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'box-freeze';
            const ts = process.env.HB_TS;
            const age = process.env.HB_AGE;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 10
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Heartbeat recovered at `' + ts + '` (age ' + age + 'm). Closing.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed'
              });
              console.log('Closed #' + issue.number);
            }
